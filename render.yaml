# Render blueprint. render.com -> New -> Blueprint -> point at this repo.
#
# BUILD_INDEX=false keeps the image build short (just deps + encoder weights);
# scripts/entrypoint.sh then builds the corpus and index on first boot. That
# trades a slow first boot (~5-10 min) for a build that won't hit Render's
# build timeout. Flip it to true if you'd rather pay the cost at build time.
#
# Sizing: encoder + a 400-query index needs ~1.5GB RAM. The free tier (512MB)
# is NOT enough — it will OOM. Use `starter` or above.
services:
  - type: web
    name: voice-enabled-rag
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter                # 512MB is not enough; starter = 2GB
    healthCheckPath: /v1/health
    dockerBuildArgs:
      BUILD_INDEX: false
      MAX_QUERIES: 400
      LANGUAGES: hin
    envVars:
      - key: MAX_QUERIES         # used by entrypoint.sh on first boot
        value: 400
      - key: LANGUAGES
        value: hin
      - key: EMBED_THREADS
        value: 2                 # match the instance's core count
      - key: DEFAULT_MODE
        value: fast
      # Set these in the Render dashboard, not here. Both are optional.
      - key: SARVAM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: index
      mountPath: /app/data       # persist the index across restarts
      sizeGB: 2
